<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCore Roadmap - Neon District</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap');
        
        * {
            font-family: 'IBM Plex Sans', sans-serif;
        }
        
        code, pre {
            font-family: 'IBM Plex Mono', monospace;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            background-attachment: fixed;
        }

        .neon-glow {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3), inset 0 0 20px rgba(6, 182, 212, 0.05);
        }

        .gradient-text {
            background: linear-gradient(90deg, #06b6d4, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .phase-card {
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .phase-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .phase-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, currentColor, transparent);
        }

        .phase-p1 { color: #3b82f6; }
        .phase-p2 { color: #ec4899; }
        .phase-p3 { color: #3b82f6; }
        .phase-p4 { color: #22c55e; }
        .phase-p5 { color: #a855f7; }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-complete {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.5);
        }

        .status-todo {
            background: rgba(251, 191, 36, 0.2);
            color: #fcd34d;
            border: 1px solid rgba(251, 191, 36, 0.5);
        }

        .status-progress {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.5);
        }

        .status-idea {
            background: rgba(168, 85, 247, 0.2);
            color: #e9d5ff;
            border: 1px solid rgba(168, 85, 247, 0.5);
        }

        .milestone-row {
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .milestone-row:hover {
            background-color: rgba(6, 182, 212, 0.05);
            border-left-color: #06b6d4;
            transform: translateX(4px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.75rem;
            color: #cbd5e1;
            background: rgba(6, 182, 212, 0.1);
            border-bottom: 2px solid rgba(6, 182, 212, 0.3);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(6, 182, 212, 0.1);
            color: #e2e8f0;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(20px);
            }
            to { 
                opacity: 1; 
                transform: translateY(0);
            }
        }

        .btn-primary {
            background: linear-gradient(90deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
            border: 1px solid rgba(6, 182, 212, 0.5);
            color: #06b6d4;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, rgba(6, 182, 212, 0.3), rgba(139, 92, 246, 0.3));
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
        }
    </style>
</head>
<body class="text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const phaseMetadata = {
            'P1 - Foundation': {
                id: 'P1',
                name: 'FOUNDATION',
                title: 'Server-Kern & Basis-Systeme',
                color: 'phase-p1',
                description: 'Sichere Infrastruktur, Einreise-System und essenzielle HUD-Elemente für stabilen Spielbetrieb',
                duration: '4-6W',
                icon: '⚙️',
                communityDesc: 'Hier entsteht die technische Grundlage. Alles von der Datenbank bis zu deinem Charakter-Creator wird hier stabilisiert.'
            },
            'P2 - Identity': {
                id: 'P2',
                name: 'IDENTITY',
                title: 'Charakter & Persönlichkeit',
                color: 'phase-p2',
                description: 'Erscheinungsbild, Augmentierungen und dein Ruf in der Welt – mach deinen Charakter einzigartig',
                duration: '3-4W',
                icon: '👤',
                communityDesc: 'Dein Charakter soll einzigartig sein. Friseur, Tätowierer, Augmentierungen – alles hier entsteht.'
            },
            'P3 - Society': {
                id: 'P3',
                name: 'SOCIETY',
                title: 'Fraktionen & Gesellschaft',
                color: 'phase-p3',
                description: 'LCPD, Trauma-Team, Gangs & Jobs – Fraktionen zum Leben erwecken mit vollständigen RP-Loops',
                duration: '4-6W',
                icon: '👮',
                communityDesc: 'Hier entstehen die Fraktionen. Cop sein, Trauma-Team spielen, einer Gang beitreten – all das wird umgesetzt.'
            },
            'P4 - Economy': {
                id: 'P4',
                name: 'WIRTSCHAFT',
                title: 'Economy & Systeme',
                color: 'phase-p4',
                description: 'Banking, Shops, Fahrzeuge & illegale Wirtschaft – ein geschlossener, ausbalancierter Geldkreislauf',
                duration: '4-5W',
                icon: '💰',
                communityDesc: 'Von legaler Arbeit bis zum Heist – hier wird die komplette Wirtschaft aufgebaut. Verdiene, gebe aus, investiere.'
            },
            'P5 - Ambient': {
                id: 'P5',
                name: 'WELT & AMBIENTE',
                title: 'Mapping & Atmosphäre',
                color: 'phase-p5',
                description: 'Zonen, MLOs, Neon-Ästhetik und Sounds – eine lebendige Cyberpunk-Welt entsteht',
                duration: '3-4W',
                icon: '🌍',
                communityDesc: 'Die Welt wird zum Leben erweckt. Neon-Billboards, Radio-Sender, unterschiedliche Zonen-Atmosphären.'
            }
        };

        function normalizePhaseKey(key) {
            return key.replace(/\s+/g, ' ').trim();
        }

        const phaseData = {
            'P1 - Foundation': [
                { name: 'Server-Infrastruktur & Basis-Stack', desc: 'qbx_core / oxmysql / ox_lib stabil und performant', status: 'progress' },
                { name: 'Einreise & Multichar-System', desc: 'Spieler können Server betreten, Charakter auswählen und neue Identität anlegen', status: 'progress' },
                { name: 'neon_hud – Spieler-Dashboard', desc: 'Echtzeit-Anzeige für HP, Rüstung, Hunger, Durst, GPS und aktive Zone', status: 'progress' },
                { name: 'Charakter-Creator', desc: 'Vollständige Charaktererstellung mit CyberCore-UI-Theme', status: 'complete' },
                { name: 'Basis-UX & Theme', desc: 'Einheitliches Loadscreen, Menü-Design und Benachrichtigungssystem', status: 'progress' },
                { name: 'VOIP-System', desc: 'Sprachkommunikation mit zonen-abhängiger Reichweite und Fraktions-Funk', status: 'todo' },
                { name: 'HUD-Editor', desc: 'Spieler können HUD-Elemente verschieben und anpassen (Drag & Drop)', status: 'todo' },
                { name: 'Minimap & GPS', desc: 'Navigations-System mit Zonen-Markierungen und Straßenbeschriftung', status: 'todo' },
                { name: 'Inventar-System', desc: 'Entscheidung und Integration des Inventar-Management-Systems', status: 'todo' },
                { name: 'Multiplayer-Test', desc: '3+ Spieler gleichzeitig – alle Basis-Funktionen ohne Fehler', status: 'todo' },
                { name: 'Performance-Messung', desc: 'Resmon-Baseline dokumentieren (Ziel: idle < 0.01ms)', status: 'todo' },
            ],
            'P2 - Identity': [
                { name: 'Charakter-Appearance-System', desc: 'Friseur, Tätowierer, Kleidungsladen mit vollständiger Anpassung', status: 'complete' },
                { name: 'Augmentierungen & Implantate', desc: '4 Basis-Augmentierungen mit echten Gameplay-Effekten (Speed, Armor, Vision)', status: 'todo' },
                { name: 'Street Cred System', desc: 'XP-basiertes Rang-System (0–1000 Punkte) mit Titeln sichtbar im HUD', status: 'todo' },
                { name: 'Reputation Matrix', desc: 'Dein Ruf bei jeder Fraktion (–100 bis +100) mit Konsequenzen bei Extremwerten', status: 'todo' },
                { name: 'Cyber-Psychose', desc: 'Humanity-Wert (0–100): Sinkt mit Augmentierungen, löst Glitch-Effekte aus', status: 'todo' },
                { name: 'Charakter-Background & ID', desc: 'Lore-Auswahl bei Einreise, ID-System für Zonen-Zugang', status: 'todo' },
                { name: 'Sichtbare Augmentierungen', desc: 'Augmentierungen sind am Charakter-Model visuell erkennbar', status: 'idea' },
                { name: 'Soziales Menü', desc: 'Freundeslisten, Charakter-Profile und Social-Features', status: 'todo' },
            ],
            'P3 - Society': [
                { name: 'LCPD – Vollständiger RP-Loop', desc: 'Streife, Verhaftung, Verhör, Bestrafung – komplettes Polizei-System', status: 'todo' },
                { name: 'Trauma-Team – Rettungsdienst', desc: 'Dispatch-System mit Bronze/Silber/Gold Abo-Tiers und Zonen-Logik', status: 'todo' },
                { name: 'Gang-System', desc: 'Gang-Hierarchie, Territorien, Kasse und Gang-Menü zum Launch', status: 'todo' },
                { name: 'Fixer-Netzwerk', desc: 'Missions-System mit skalierbaren Aufträgen je nach Street-Cred', status: 'todo' },
                { name: 'Gefängnis & Justiz', desc: 'Prison-Timer, Strafkatalog und Anwalts-System', status: 'todo' },
                { name: 'Starter-Jobs', desc: 'Einstiegs-Jobs: Müllwagen, Trucker, Busfahrer mit fairer Bezahlung', status: 'todo' },
                { name: 'Berufs-Jobs', desc: 'Mechaniker, Arzt, Hacker als spezialisierte Job-Optionen', status: 'todo' },
                { name: 'Fraktions-Management', desc: 'Ränge vergeben, Kasse verwalten, Dienstplan für Leitungen', status: 'todo' },
                { name: 'LCPD Korruptionssystem', desc: 'Greed-Wert für Polizisten – zu hohe Werte führen zu IA-Ermittlung', status: 'todo' },
            ],
            'P4 - Economy': [
                { name: 'Banking & Economy', desc: 'ATMs, Konten, Überweisungen und Steuer-System gegen Inflation', status: 'todo' },
                { name: 'lb-phone (Handy)', desc: 'Smartphone mit Banking-App, Kontakte, Nachrichten und integrierter Karte', status: 'todo' },
                { name: 'Shops & Märkte', desc: 'Legale und illegale Shops mit Zonen-Logik (Zone 1 teuer, Zone 3 günstig)', status: 'todo' },
                { name: 'Fahrzeuge & Garagen', desc: 'Kauf, Keys-System, persönliche Garagen mit Respawn-Logik', status: 'todo' },
                { name: 'Fahrzeug-Tuning', desc: 'Custom-Shop: Lackierung, Felgen, Upgrades und Chop-Shop zum Ausschlachten', status: 'todo' },
                { name: 'Neuro-Link & Hacking', desc: 'Data-Items sammeln, Hacking-Minispiel, Daten verkaufen mit Cooldown', status: 'todo' },
                { name: 'Illegale Wirtschaft', desc: 'Heists, Drogenschmuggel, Daten-Schmuggel und Schwarzmarkt-Basis', status: 'todo' },
                { name: 'Economy-Balance', desc: 'Testläufe mit mehreren Spielern – Inflation und Preise abgestimmt', status: 'todo' },
                { name: 'Mülltonnen-System', desc: 'Items in Mülltonnen finden, Crafting für Augmentierungen ermöglichen', status: 'todo' },
            ],
            'P5 - Ambient': [
                { name: 'Zonen-Einteilung', desc: 'Zone 1 (Corporate), Zone 2 (Mixed), Zone 3 (Slums) physisch abgegrenzt', status: 'todo' },
                { name: 'MLO: Corp-Tower Zone 1', desc: 'Büros, Lobby, Dachterrasse – Zentrum der Konzerne', status: 'idea' },
                { name: 'MLO: Underground-Markt Zone 2', desc: 'Handelsplatz mit Bars und versteckten Gängen', status: 'idea' },
                { name: 'MLO: Trauma-Team Station', desc: 'Rettungszentrale mit Einsatz-Planung und Wartebereich', status: 'idea' },
                { name: 'MLO: Neon-Club', desc: 'Social Hub und Treffpunkt der Szene', status: 'idea' },
                { name: 'MLO: Hacker-Den', desc: 'Versteckter Zugang – HQ für Netrunner-Aktivitäten', status: 'idea' },
                { name: 'Cyberpunk-Ästhetik', desc: 'Neon-Billboards, Hologramme, dynamische Propaganda-Screens', status: 'todo' },
                { name: 'Ambiente-Sounds', desc: 'Zonen-spezifische Musik und Geräusche (Zone 1: Still, Zone 3: Chaos)', status: 'todo' },
                { name: 'Radio-System', desc: 'Zwei Sender: Neon-FM (Corporate) vs. UnderNet (Underground-Musik)', status: 'todo' },
            ]
        };

        function HomePage({ onPhaseSelect }) {
            const phases = ['P1 - Foundation', 'P2 - Identity', 'P3 - Society', 'P4 - Economy', 'P5 - Ambient'];
            
            return (
                <div className="fade-in">
                    <div className="text-center mb-16">
                        <h1 className="text-6xl font-black mb-4">
                            <span className="gradient-text">CYBERCORE</span>
                        </h1>
                        <p className="text-cyan-300/70 text-sm tracking-widest mb-4">NEON DISTRICT ROADMAP</p>
                        <p className="text-slate-400 text-lg">5 Phasen • 18–24 Wochen • Ein vollständiger, lebendiger RP-Server</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 mb-16">
                        {phases.map((phaseKey) => {
                            const meta = phaseMetadata[phaseKey];
                            const tasks = phaseData[phaseKey] || [];
                            const completed = tasks.filter(t => t.status === 'complete').length;
                            const progress = tasks.length > 0 ? Math.round((completed / tasks.length) * 100) : 0;
                            
                            return (
                                <div
                                    key={phaseKey}
                                    onClick={() => onPhaseSelect(phaseKey)}
                                    className={`phase-card bg-slate-800/50 border border-slate-700/50 rounded-lg p-6 neon-glow ${meta.color}`}
                                >
                                    <div className="text-4xl mb-4">{meta.icon}</div>
                                    <div className="text-sm font-mono text-slate-400 mb-2">{meta.name}</div>
                                    <h3 className="text-lg font-bold mb-2">{meta.title}</h3>
                                    <p className="text-xs text-slate-400 mb-4 line-clamp-2">{meta.description}</p>
                                    <div className="flex items-center justify-between text-xs">
                                        <span className="text-slate-500">{tasks.length} Features</span>
                                        <span className="font-bold text-cyan-300">{progress}%</span>
                                    </div>
                                    <div className="mt-3 w-full bg-slate-900 rounded-full h-1.5 overflow-hidden border border-cyan-500/30">
                                        <div 
                                            className="bg-gradient-to-r from-green-500 to-cyan-400 h-full"
                                            style={{ width: `${progress}%` }}
                                        />
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="bg-slate-800/30 border border-cyan-500/20 rounded-lg p-8 text-center">
                        <h2 className="text-2xl font-bold mb-8 gradient-text">GESAMTZEITPLAN</h2>
                        <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
                            {phases.map((phaseKey) => {
                                const meta = phaseMetadata[phaseKey];
                                return (
                                    <div key={phaseKey} className="bg-slate-800/50 rounded-lg p-4 border border-slate-700/50">
                                        <div className="text-2xl font-bold text-cyan-400 mb-2">{meta.duration}</div>
                                        <div className="text-xs text-slate-400 uppercase tracking-wide">{meta.name}</div>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="text-3xl font-bold gradient-text">
                            Gesamt: 18–24 Wochen bis zum vollständigen Launch
                        </div>
                    </div>
                </div>
            );
        }

        function PhaseDetail({ phaseKey, onBack }) {
            const meta = phaseMetadata[phaseKey];
            const tasks = phaseData[phaseKey] || [];
            
            if (!meta) return null;

            const completedCount = tasks.filter(t => t.status === 'complete').length;
            const progressCount = tasks.filter(t => t.status === 'progress').length;
            const todoCount = tasks.filter(t => t.status === 'todo').length;
            const ideaCount = tasks.filter(t => t.status === 'idea').length;
            const progress = tasks.length > 0 ? Math.round((completedCount / tasks.length) * 100) : 0;

            const getStatusBadge = (status) => {
                switch(status) {
                    case 'complete': return <span className="status-badge status-complete">✓ Fertig</span>;
                    case 'todo': return <span className="status-badge status-todo">→ In Planung</span>;
                    case 'progress': return <span className="status-badge status-progress">⚙️ In Entwicklung</span>;
                    case 'idea': return <span className="status-badge status-idea">💡 Geplant</span>;
                    default: return null;
                }
            };

            return (
                <div className="fade-in">
                    <button 
                        onClick={onBack}
                        className="btn-primary mb-8 flex items-center gap-2"
                    >
                        ← Zurück zur Übersicht
                    </button>

                    <div className="bg-slate-800/50 border border-slate-700/50 rounded-lg p-8 mb-8 neon-glow">
                        <div className="flex items-start justify-between mb-6">
                            <div>
                                <div className="text-5xl mb-4">{meta.icon}</div>
                                <div className="text-sm font-mono text-slate-400 mb-2">{meta.name}</div>
                                <h1 className="text-4xl font-black mb-4">
                                    <span className="gradient-text">{meta.title}</span>
                                </h1>
                                <p className="text-slate-400 mb-4 max-w-2xl">{meta.description}</p>
                                <p className="text-slate-300 text-lg italic">{meta.communityDesc}</p>
                            </div>
                            <div className="text-right">
                                <div className="text-5xl font-bold text-cyan-400">{meta.duration}</div>
                                <div className="text-sm text-slate-400 mt-2">Geschätzte Dauer</div>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <div className="bg-slate-800/50 border border-green-500/30 rounded-lg p-4">
                            <div className="text-2xl font-bold text-green-400">{completedCount}</div>
                            <div className="text-xs text-green-300 mt-1">Fertig</div>
                        </div>
                        <div className="bg-slate-800/50 border border-blue-500/30 rounded-lg p-4">
                            <div className="text-2xl font-bold text-blue-400">{progressCount}</div>
                            <div className="text-xs text-blue-300 mt-1">In Entwicklung</div>
                        </div>
                        <div className="bg-slate-800/50 border border-yellow-500/30 rounded-lg p-4">
                            <div className="text-2xl font-bold text-yellow-400">{todoCount}</div>
                            <div className="text-xs text-yellow-300 mt-1">In Planung</div>
                        </div>
                        <div className="bg-slate-800/50 border border-purple-500/30 rounded-lg p-4">
                            <div className="text-2xl font-bold text-purple-400">{ideaCount}</div>
                            <div className="text-xs text-purple-300 mt-1">Geplant</div>
                        </div>
                    </div>

                    <div className="mb-8 bg-slate-800/50 border border-cyan-500/20 rounded-lg p-4">
                        <div className="flex justify-between items-center mb-2">
                            <span className="text-sm text-cyan-300 font-semibold">Phase-Fortschritt</span>
                            <span className="text-sm font-bold text-cyan-400">{completedCount} / {tasks.length} (${progress}%)</span>
                        </div>
                        <div className="w-full bg-slate-900 rounded-full h-3 overflow-hidden border border-cyan-500/30">
                            <div 
                                className="bg-gradient-to-r from-green-500 via-cyan-400 to-purple-500 h-full transition-all duration-500"
                                style={{ width: `${progress}%` }}
                            />
                        </div>
                    </div>

                    <div className="bg-slate-800/50 border border-slate-700/50 rounded-lg overflow-hidden neon-glow">
                        <div className="p-6 bg-slate-900/50 border-b border-cyan-500/20">
                            <h2 className="text-2xl font-bold gradient-text">FEATURES & DETAILS</h2>
                        </div>
                        <div className="p-6 overflow-x-auto">
                            <table>
                                <thead>
                                    <tr>
                                        <th style={{ width: '35%' }}>Feature</th>
                                        <th style={{ width: '50%' }}>Beschreibung</th>
                                        <th style={{ width: '15%' }}>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {tasks.map((task, idx) => (
                                        <tr key={idx} className="milestone-row">
                                            <td><strong>{task.name}</strong></td>
                                            <td className="text-slate-300">{task.desc || '–'}</td>
                                            <td>{getStatusBadge(task.status)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [currentPhase, setCurrentPhase] = useState(null);

            return (
                <div className="min-h-screen py-12 px-4">
                    <div className="max-w-7xl mx-auto">
                        {currentPhase ? (
                            <PhaseDetail 
                                phaseKey={currentPhase} 
                                onBack={() => setCurrentPhase(null)}
                            />
                        ) : (
                            <HomePage onPhaseSelect={setCurrentPhase} />
                        )}
                        
                        <div className="mt-16 text-center text-slate-500 text-xs border-t border-cyan-500/20 pt-8">
                            <p>🚀 NEON DISTRICT • CYBERCORE DEVELOPMENT • STAND: März 2026</p>
                            <p className="mt-2">Folge uns auf Discord für Live-Updates und Join unserer Community!</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
